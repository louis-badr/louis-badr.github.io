<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#F4EFDC">
  <defs>
    <pattern id="layers" width="12" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="5" x2="12" y2="5" stroke="#9A9DB3" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Round horizontal hole -->
  <line x1="15" y1="222" x2="225" y2="222" stroke="#9A9DB3" stroke-width="4"/>
  <rect x="30" y="30" width="180" height="190" fill="url(#layers)" stroke="#F4EFDC" stroke-width="2.5"/>
  <circle cx="120" cy="135" r="50" fill="#12183B" stroke="#F4EFDC" stroke-width="2.5"/>
  <path d="M84.6 99.6 A50 50 0 0 1 155.4 99.6" fill="none" stroke="#E86A33" stroke-width="6"/>
  <text x="120" y="258" text-anchor="middle">Round</text>

  <!-- Teardrop horizontal hole: 45° roof -->
  <line x1="255" y1="222" x2="465" y2="222" stroke="#9A9DB3" stroke-width="4"/>
  <rect x="270" y="30" width="180" height="190" fill="url(#layers)" stroke="#F4EFDC" stroke-width="2.5"/>
  <path d="M324.6 99.6 L360 64.3 L395.4 99.6 A50 50 0 1 1 324.6 99.6 Z" fill="#12183B" stroke="#F4EFDC" stroke-width="2.5"/>
  <path d="M324.6 99.6 L360 64.3 L395.4 99.6" fill="none" stroke="#8C9BFF" stroke-width="6"/>
  <text x="360" y="258" text-anchor="middle">Teardrop</text>
</svg>
