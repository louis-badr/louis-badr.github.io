<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#F4EFDC">
  <defs>
    <g id="spool">
      <circle r="34" fill="none" stroke="#9A9DB3" stroke-width="10"/>
      <circle r="10" fill="none" stroke="#9A9DB3" stroke-width="3"/>
    </g>
    <g id="motor">
      <rect x="-20" y="-18" width="40" height="36" rx="3" fill="#8C9BFF"/>
      <circle r="6" fill="#12183B"/>
    </g>
    <g id="hotend">
      <rect x="-14" y="0" width="28" height="44" fill="#F4EFDC"/>
      <path d="M-8 44 H8 L0 58 Z" fill="#E86A33"/>
    </g>
  </defs>

  <!-- Direct drive -->
  <g transform="translate(0 0)">
    <line x1="20" y1="70" x2="280" y2="70" stroke="#9A9DB3" stroke-width="4"/>
    <line x1="80" y1="150" x2="280" y2="150" stroke="#9A9DB3" stroke-width="6"/>
    <use href="#spool" x="45" y="190"/>
    <path d="M45 156 C45 60 120 20 190 34" fill="none" stroke="#F4EFDC" stroke-width="2.5"/>
    <use href="#motor" x="190" y="52"/>
    <use href="#hotend" x="190" y="72"/>
    <text x="150" y="245" text-anchor="middle" font-size="20" font-weight="bold">Direct drive</text>
  </g>

  <!-- Bowden -->
  <g transform="translate(300 0)">
    <line x1="20" y1="70" x2="280" y2="70" stroke="#9A9DB3" stroke-width="4"/>
    <line x1="80" y1="150" x2="280" y2="150" stroke="#9A9DB3" stroke-width="6"/>
    <use href="#spool" x="45" y="190"/>
    <path d="M45 156 L45 120" fill="none" stroke="#F4EFDC" stroke-width="2.5"/>
    <use href="#motor" x="45" y="102"/>
    <path d="M45 84 C45 20 190 10 190 70" fill="none" stroke="#F4EFDC" stroke-width="2.5" stroke-dasharray="7 4"/>
    <use href="#hotend" x="190" y="72"/>
    <text x="150" y="245" text-anchor="middle" font-size="20" font-weight="bold">Bowden</text>
  </g>

  <!-- Legend -->
  <rect x="210" y="2" width="18" height="14" rx="2" fill="#8C9BFF"/>
  <text x="234" y="14">motor</text>
  <line x1="300" y1="9" x2="330" y2="9" stroke="#F4EFDC" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="336" y="14">PTFE tube</text>
</svg>
