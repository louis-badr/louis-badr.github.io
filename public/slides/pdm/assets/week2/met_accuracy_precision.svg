<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#F4EFDC">
  <defs>
    <g id="target">
      <circle r="100" fill="none" stroke="#9A9DB3" stroke-width="2"/>
      <circle r="66" fill="none" stroke="#9A9DB3" stroke-width="2"/>
      <circle r="33" fill="none" stroke="#9A9DB3" stroke-width="2"/>
      <line x1="-110" y1="0" x2="110" y2="0" stroke="#9A9DB3" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="-110" x2="0" y2="110" stroke="#9A9DB3" stroke-width="1" opacity="0.5"/>
    </g>
  </defs>

  <!-- Column and row labels -->
  <text x="350" y="34" text-anchor="middle">Precise</text>
  <text x="610" y="34" text-anchor="middle">Not precise</text>
  <text x="200" y="183" text-anchor="end">Accurate</text>
  <text x="200" y="433" text-anchor="end">Not accurate</text>

  <!-- Accurate and precise: tight group on the centre -->
  <use href="#target" x="350" y="175"/>
  <g fill="#8C9BFF">
    <circle cx="344" cy="171" r="7"/><circle cx="355" cy="168" r="7"/><circle cx="358" cy="179" r="7"/>
    <circle cx="346" cy="182" r="7"/><circle cx="352" cy="176" r="7"/><circle cx="342" cy="177" r="7"/>
  </g>

  <!-- Accurate, not precise: wide group around the centre -->
  <use href="#target" x="610" y="175"/>
  <g fill="#8C9BFF">
    <circle cx="560" cy="155" r="7"/><circle cx="650" cy="130" r="7"/><circle cx="665" cy="205" r="7"/>
    <circle cx="580" cy="230" r="7"/><circle cx="620" cy="115" r="7"/><circle cx="555" cy="215" r="7"/>
  </g>

  <!-- Precise, not accurate: tight group off the centre -->
  <use href="#target" x="350" y="425"/>
  <g fill="#E86A33">
    <circle cx="389" cy="381" r="7"/><circle cx="400" cy="378" r="7"/><circle cx="403" cy="389" r="7"/>
    <circle cx="391" cy="392" r="7"/><circle cx="397" cy="386" r="7"/><circle cx="387" cy="387" r="7"/>
  </g>

  <!-- Neither: wide group off the centre -->
  <use href="#target" x="610" y="425"/>
  <g fill="#E86A33">
    <circle cx="600" cy="425" r="7"/><circle cx="695" cy="420" r="7"/><circle cx="670" cy="505" r="7"/>
    <circle cx="610" cy="495" r="7"/><circle cx="655" cy="435" r="7"/><circle cx="690" cy="470" r="7"/>
  </g>
</svg>
