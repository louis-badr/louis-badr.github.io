<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#F4EFDC">
  <defs>
    <pattern id="layers" width="12" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="5" x2="12" y2="5" stroke="#9A9DB3" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Fillet on the bottom edge -->
  <line x1="15" y1="222" x2="225" y2="222" stroke="#9A9DB3" stroke-width="4"/>
  <path d="M50 40 V150 A70 70 0 0 0 120 220 H200 V40 Z" fill="url(#layers)" stroke="#F4EFDC" stroke-width="2.5"/>
  <path d="M70.5 199.5 A70 70 0 0 0 120 220" fill="none" stroke="#E86A33" stroke-width="6"/>
  <text x="120" y="258" text-anchor="middle">Fillet</text>

  <!-- 45° chamfer on the bottom edge -->
  <line x1="255" y1="222" x2="465" y2="222" stroke="#9A9DB3" stroke-width="4"/>
  <path d="M290 40 V150 L360 220 H440 V40 Z" fill="url(#layers)" stroke="#F4EFDC" stroke-width="2.5"/>
  <path d="M290 150 L360 220" fill="none" stroke="#8C9BFF" stroke-width="6"/>
  <text x="360" y="258" text-anchor="middle">Chamfer 45°</text>
</svg>
